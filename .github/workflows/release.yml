# 使用 npm Trusted Publishing（OIDC）发布，无需 NPM_TOKEN：
#   1. npm 包设置页配置 Trusted Publisher（seepine / naive-plus / release.yml）
#   2. 需 npm >= 11.5.1，故 node-version 用 24.x，发布时自动生成 provenance
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # 换取 OIDC 令牌，用于 Trusted Publishing 与自动 provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org' # OIDC 流程需要
          package-manager-cache: false # 发布构建禁用缓存

      - name: Setup Pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.x

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm lint:eslint
          pnpm lint:stylelint
          pnpm lint:prettier

      - name: Test example
        run: |
          pnpm ui:build
          cd examples
          pnpm build-only

      # https://github.com/changesets/action
      # 无 changeset 时执行 changeset publish，经 OIDC 发布
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm cs:version
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
